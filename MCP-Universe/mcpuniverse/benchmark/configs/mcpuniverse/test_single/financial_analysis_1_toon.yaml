kind: llm
spec:
  name: llm-1
  type: openrouter
  config:
    model_name: qwen/qwen3-32b
    temperature: 0.6
    max_completion_tokens: 20000
    timeout: 180

---
kind: agent
spec:
  name: ReAct-agent
  type: react
  config:
    llm: llm-1
    instruction: You are an agent for financial analysis. If you need to calculate the result, you can use the calculator tool.
    max_iterations: 20
    summarize_tool_response: false
    tool_format: toon
    servers:
      - name: yfinance
      - name: calculator

---
kind: benchmark
spec:
  description: Test agent for yfinance tasks (single task).
  agent: ReAct-agent
  tasks:
    - mcpuniverse/financial_analysis/yfinance_task_0001.json
