kind: llm
spec:
  name: llm-1
  type: openrouter
  config:
    model_name: qwen/qwen3-32b
    temperature: 0.6
    max_completion_tokens: 20000
    timeout: 180

---
kind: agent
spec:
  name: ReAct-agent
  type: react
  config:
    llm: llm-1
    instruction: You are an agent for web searching. If you don't have enough information to answer the question, you can use the google-search tool. If you want to obtain the information with a specific URL, you can use the fetch tool.
    max_iterations: 20
    summarize_tool_response: true
    tool_format: tron

---
kind: benchmark
spec:
  description: Test agent for google search tasks (single task).
  agent: ReAct-agent
  tasks:
    - mcpuniverse/web_search/info_search_task_0001.json
