kind: llm
spec:
  name: llm-1
  type: openrouter
  config:
    model_name: qwen/qwen3-32b
    temperature: 0.6
    max_completion_tokens: 20000
    timeout: 180

---
kind: agent
spec:
  name: ReAct-agent
  type: react
  config:
    llm: llm-1
    instruction: You are an agent for Browser automation.
    max_iterations: 20
    summarize_tool_response: false
    tool_format: json

---
kind: benchmark
spec:
  description: Test agent for playwright tasks (single task).
  agent: ReAct-agent
  tasks:
    - mcpuniverse/browser_automation/playwright_paper_task_0001.json
