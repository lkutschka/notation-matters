kind: llm
spec:
  name: llm-1
  type: openrouter
  config:
    model_name: qwen/qwen3-32b
    temperature: 0.6
    max_completion_tokens: 20000
    timeout: 180

---
kind: agent
spec:
  name: ReAct-agent
  type: react
  config:
    llm: llm-1
    instruction: You are an agent for 3D Designing and a Blender expert.
    max_iterations: 20
    summarize_tool_response: false
    tool_format: json
    servers:
    - name: blender

---
kind: benchmark
spec:
  description: Full benchmark for 3d_design tasks (JSON format).
  agent: ReAct-agent
